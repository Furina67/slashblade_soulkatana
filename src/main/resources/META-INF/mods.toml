modLoader="javafml"
loaderVersion="[47,)"
license="MIT"
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="AutoMods (AI generated)"
description='''
💀 拔刀剑：重锋 的附属模组 —— 魂刀。
“魂刀”用于将各类作品中的角色与世界观融入拔刀剑体系；本版本内容为咒术回战·两面宿傩。

本模组的代码与资源由 AI 根据一份功能设计提示词自动生成，
交由本项目归档、构建与发布；设计意图与数值均来自原始设计文档。

玩法：左键未命中施放【解】（远程月牙斩），右键命中施放【捌】（百分比削血 / 近战伤害），
鼠标中键发动【领域展开】。另新增【两面宿傩的手指】物品（结构宝箱 20% 概率出现，食用即死）。

需要前置模组 SlashBlade，否则本模组不提供任何游戏内容。
详细说明见 README.md。
'''
[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="[${forge_version},)"
ordering="NONE"
side="BOTH"
[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="[${minecraft_version}]"
ordering="NONE"
side="BOTH"
[[dependencies.${mod_id}]]
modId="slashblade"
mandatory=true
versionRange="[1.9,)"
ordering="AFTER"
side="BOTH"
